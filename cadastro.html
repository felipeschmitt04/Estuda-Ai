<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Estuda Aí</title>
    <link rel="stylesheet" href="./assets/css/pages/cadastro.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <section class="cadastro-container">
        <div class="cadastro-card">
            <h2 style="margin-bottom: 20px;">Faça seu cadastro!</h2>
            <form class="form-grid">
                <div class="input-field">
                    <i class='bx bxs-user-account'></i>
                    <input type="text" placeholder="Nome" required>
                </div>
                <div class="input-field">
                    <i class='bx bxs-envelope' ></i>
                    <input type="email" placeholder="E-mail" required>
                </div>
                <div class="coluna">
                    <div class="input-field">
                        <i class='bx bxs-user-circle'></i>
                        <input type="text" placeholder="Usuário" required>
                    </div>
                    <div class="input-field">
                        <i class='bx bxs-id-card'></i>
                        <input type="text" placeholder="Matrícula" required>
                    </div>
                </div>
                <div class="coluna">
                    <div class="input-field senha">
                        <i class='bx bxs-lock-alt'></i>
                        <input type="password" id="password1" placeholder="Senha" required>
                        <i class='bx bx-low-vision' ></i>
                    </div>
                    <div class="input-field senha">
                        <i class='bx bxs-lock-alt'></i>
                        <input type="password" id="password2" placeholder="Confirmar Senha" required>
                        <i class='bx bx-low-vision' ></i>
                    </div>
                </div>
                <button type="submit" class="login-button">Cadastrar</button>
            </form>
            <div class="options">
                <p>Já possui uma conta? <a href="login.html">Faça login</a></p>
            </div>
        </div>
    </section>
</body>
</html>
