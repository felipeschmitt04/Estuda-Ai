<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Estuda Aí</title>
    <link rel="stylesheet" href="./assets/css/pages/login.css" />
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  </head>

  <body>
    <section class="login-container">
      <div class="login-card">
        <h2>Faça login para acessar o Estuda Aí</h2>
        <div class="login-icon">
          <img src="/assets/imgs/login-icon.svg" alt="login-icon" />
        </div>
        <form>
          <div class="input-field">
            <i class='bx bxs-envelope' ></i>
            <input type="email" required placeholder="Email" />
          </div>
          <div class="input-field">
            <i class='bx bxs-lock-alt'></i>
            <input type="password" id="password" placeholder="Senha" required />
            <i class='bx bx-low-vision' id="togglePassword"></i>
          </div>
          <div class="options">
            <a href="#">Esqueceu a senha?</a>
          </div>
          <input class="login-button" type="button" value="Login" />
          <p>Não possui conta? <a href="cadastro.html" class="cadastre-link">Cadastre-se!</a></p>
        </form>
      </div>
    </section>
    <script src="/assets/js/tela-login.js" defer></script>
  </body>
</html>
