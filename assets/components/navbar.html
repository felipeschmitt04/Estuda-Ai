<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/pages/navbar.css">
    <script defer src="/assets/js/navbar.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="logo" id="logo-button">
            <img src="/assets/imgs/logo2.svg" width="40px">
            <h2 class="textoLogo">Estuda Aí!</h2>
        </div>
        <ul class="nav-links" id="nav-links">
            <li class="nav-item">
                <button class="notification-icon" id="notification-icon">
                    <img src="/assets/imgs/notification-icon.svg" width="30px">
                </button>
                <div class="dropdown" id="notification-box">Notificações aqui</div>
            </li>
            <li class="nav-item">
                <button class="message-icon" id="message-icon">
                    <img src="/assets/imgs/message-icon.svg" width="30px">
                </button>
                <div class="dropdown" id="message-box">Mensagens aqui</div>
            </li>
            <li class="nav-item profile-container">
                <button class="profile-icon" id="profile-icon">
                    <span style="margin-right: 10px;" class="username">@usuário</span> <img src="/assets/imgs/profile-icon.svg" width="30px">
                </button>
                <div  id="profile-box">
                    <div class="modal" id="user-modal">
                        <div class="modal-content">
                            <span class="close" id="close-modal">&times;</span>
                            <ul class="modal-options">
                                <li>Opção 1</li>
                                <li>Opção 2</li>
                                <li>Opção 3</li>
                                <li>Opção 4</li>
                            </ul>
                        </div>
                        <div class="modal-content">
                            <ul class="modal-options">
                                <li class="modal-item"><img src="/assets/imgs/profile-icon-black.svg" width="20px">Usuário</li>
                                <li class="modal-item"><img src="/assets/imgs/settings.svg" width="20px">Configurações</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </li>
        </ul>
    </nav>
</body>
</html>
